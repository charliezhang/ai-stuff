# pocket-tts LSD model sized for one Jetson AGX Orin 64GB: 6 layers x 512 wide (~30M trainable
# params) instead of the reference 24 x 1024 teacher (~400M). Same Mimi codec, tokenizer, sequence
# layout and loss as pocket-tts; only the FlowLM is smaller. Paths are inside the tiny-tts:orin
# container: /data is the data root prepare_training_on_orin.sh filled, /work the synced code.
#
# Measured on the box (batch 64, compiled): ~1.5 steps/s, so 100k steps take ~19 h;
# 14 GiB while training, 20.5 GiB peak with validation and sample writing.
# Expect an intelligible but plain voice: pocket-tts' quality numbers need the 24-layer teacher,
# 2000 h of data and 400k steps.
model_config: pocket_tts/config/english.yaml
model_overrides:
  # Local copies of the gated Mimi weights and the tokenizer, so the box needs no HF login.
  weights_path: /data/weights/model.safetensors
  flow_lm.lookup_table.tokenizer_path: /data/weights/tokenizer.json
  flow_lm.transformer.d_model: 512
  flow_lm.transformer.num_heads: 8
  flow_lm.transformer.num_layers: 6
  flow_lm.lookup_table.dim: 512        # the text table feeds the backbone directly: must equal d_model
  flow_lm.flow.dim: 512                # sampler head width (unchanged from the release)
  flow_lm.flow.depth: 6
start_from_pretrained: false

data:
  # Audio manifests written by prepare_training_on_orin.sh. The first start encodes the train set to
  # Mimi latents once (data.precompute, on by default) and trains from them; each sample still
  # reads a 0.5 s audio window at its voice-prompt cut, so the audio must stay on the box.
  train_jsonl: /data/hifitts2_200h/train_aligned.jsonl
  valid_jsonl: /data/hifitts2_200h/valid_aligned.jsonl
  max_duration_sec: 30.0
  max_voice_prompt_sec: 5.0
  loader_procs: 3

flow:
  type: lsd
  kwargs: {}

flow_batch_multiplier: 4
eos_loss_weight: 0.1
text_dropout: 0.2
voice_dropout: 0.2

optim:
  lr: 3e-4             # a little above the 24-layer recipe's 2e-4; small models tolerate it
  schedule: cosine
  warmup_steps: 1000

run_dir: /data/runs/orin_small
# Effective batch 64 (the pocket-tts README: below 64 the quality transition comes late or not at
# all). Fits in one pass at this size; if memory runs short use batch_size: 32, grad_accum_steps: 2.
batch_size: 64
grad_accum_steps: 1
max_steps: 100000
stats_ema_steps: 1000
ema_decay: 0.999
compile: true          # works on sm_87 with this torch: +25% steps/s for ~65 s of warm-up
log_freq: 50
valid_freq: 2500
num_valid_batches: 8   # covers the whole ~1 h valid set at batch 64
ckpt_freq: 2500
num_ckpt_keep: 2
sample_freq: 5000
sample_cfg_coef: 2.0
